name: Build resume PDF

# Regenerates public/resume.pdf from scripts/resume/resume.html whenever the
# source changes, and commits the PDF back to the same branch. The committed
# file is then served at:
#   https://divyashwar.vercel.app/resume.pdf  (and the short link /resume)
#   https://github.com/D-Raj-Grg/ai-portfolio/raw/main/public/resume.pdf

on:
  push:
    paths:
      - "scripts/resume/**"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Render PDF
        run: pnpm resume

      - name: Commit and push the PDF
        run: |
          if git diff --quiet -- public/resume.pdf; then
            echo "resume.pdf unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf
          git commit -m "chore: rebuild resume.pdf from scripts/resume [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
